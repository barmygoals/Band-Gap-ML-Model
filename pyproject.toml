[project]
name = "0-model"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "kaleido>=1.3.0",
    "matminer>=0.10.1",
    "mp-api>=0.46.4",
    "pymatviz>=0.18.0",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.5",
    "torch>=2.3",
    "shap>=0.46",
    "tqdm>=4.0",
    "elmd>=0.5.15",
    "numba>=0.65",
    "matfold>=1.3.3",
    "pyyaml>=6.0.3",
    "optuna>=4.9.0",
    "crabnet>=2.0.8",
    # Runtime, not dev: master-plan phase 5 imports xgboost in three steps
    # (scripts/xgb_baseline.py, xgb_ood.py, expt_gap_folds_eval.py). It sat in the
    # dev group until 2026-07-21, so `uv export --no-dev` silently omitted it from
    # requirements-hpc.txt and phase 5 died on ModuleNotFoundError after the chain's
    # first four phases had already run (job 656895). See DECISIONS.md.
    "xgboost>=3.3.0",
    "tabulate>=0.10.0",
]
[tool.pyright]
ignore = ["external_libraries"]

[dependency-groups]
dev = [
    "onnx>=1.22.0",
    "pyinstrument>=5.1.2",
]
